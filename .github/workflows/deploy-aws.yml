name: deploy-aws

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: opspilot-aws-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    environment: aws-portfolio
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: install console dependencies
        working-directory: apps/web
        run: npm ci
      - name: build portfolio artifact
        env:
          OPSPILOT_GIT_COMMIT: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ "${OPSPILOT_PAID_CLOUD_OVERRIDE:-}" = "yes" ]; then
            echo "BLOCKED BY ZERO-COST POLICY" >&2
            exit 1
          fi
          export OPSPILOT_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          infra/aws-zero-cost/package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portfolio-release
          path: |
            infra/aws-zero-cost/dist/portfolio.zip.sha256
            infra/aws-zero-cost/dist/release-metadata.json
          if-no-files-found: error
      - name: require deployer role
        env:
          OPSPILOT_AWS_ROLE_ARN: ${{ vars.OPSPILOT_AWS_ROLE_ARN }}
        run: |
          case "$OPSPILOT_AWS_ROLE_ARN" in
            arn:aws:iam::*:role/opspilot-github-deployer) ;;
            *) echo "GitHub variable OPSPILOT_AWS_ROLE_ARN must name role opspilot-github-deployer" >&2; exit 1 ;;
          esac
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.OPSPILOT_AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: opspilot-portfolio-deploy
      - name: publish and verify
        env:
          OPSPILOT_PORTFOLIO_PUBLISH: "yes"
          OPSPILOT_GITHUB_OIDC: "yes"
        run: scripts/aws-portfolio-publish.sh
