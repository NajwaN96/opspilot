apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opspilot-demo
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: opspilot
    opspilot.io/environment: aws-dev
spec:
  project: default
  source:
    repoURL: https://github.com/example/opspilot
    targetRevision: main
    path: gitops/overlays/aws-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-shop
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
