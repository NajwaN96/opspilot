apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: opspilot-system
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  provider.yml: |
    apiVersion: 1
    providers:
      - name: OpsPilot
        type: file
        options:
          path: /var/lib/grafana/dashboards
  payment.json: |
    {"title":"OpsPilot payment-api","uid":"opspilot-payment","schemaVersion":39,"timezone":"utc","refresh":"10s","panels":[{"type":"timeseries","title":"Request rate","gridPos":{"h":8,"w":12,"x":0,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (version, release_role) (rate(http_requests_total{service=\"payment-api\"}[1m]))","legendFormat":"{{version}} {{release_role}}"}]},{"type":"timeseries","title":"Error rate","gridPos":{"h":8,"w":12,"x":12,"y":0},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"sum by (version, release_role) (rate(http_requests_total{service=\"payment-api\",status_code=~\"5..\"}[1m])) / sum by (version, release_role) (rate(http_requests_total{service=\"payment-api\"}[1m]))","legendFormat":"{{version}} {{release_role}}"}]},{"type":"timeseries","title":"p95 latency","gridPos":{"h":8,"w":24,"x":0,"y":8},"datasource":{"type":"prometheus","uid":"prometheus"},"targets":[{"expr":"histogram_quantile(0.95, sum by (le, version, release_role) (rate(http_request_duration_seconds_bucket{service=\"payment-api\"}[1m])))","legendFormat":"{{version}} {{release_role}}"}]}]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: opspilot-system
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: opspilot
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: opspilot
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/provider.yml
              subPath: provider.yml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/payment.json
              subPath: payment.json
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: opspilot-system
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
