apiVersion: v1
kind: Namespace
metadata:
  name: opspilot-system
  labels:
    app.kubernetes.io/part-of: opspilot
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-shop
  labels:
    app.kubernetes.io/part-of: demo-shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: demo-shop
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: demo-shop
    app.kubernetes.io/version: "1.6.0"
    opspilot.io/managed: "true"
    opspilot.io/service: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/version: "1.6.0"
        opspilot.io/managed: "true"
        opspilot.io/service: storefront
    spec:
      containers:
        - name: storefront
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: demo-shop
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: demo-shop
    opspilot.io/service: storefront
spec:
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
---
