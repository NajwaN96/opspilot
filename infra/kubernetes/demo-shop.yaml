  labels:
    app.kubernetes.io/name: traffic
    app.kubernetes.io/part-of: demo-shop
    opspilot.io/managed: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traffic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traffic
        app.kubernetes.io/part-of: demo-shop
        opspilot.io/managed: "true"
    spec:
      containers:
        - name: traffic
          image: opspilot-demo:0.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: traffic
            - name: TARGET_URL
              value: http://storefront/buy
            - name: INTERVAL
              value: 200ms
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
