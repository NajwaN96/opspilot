apiVersion: v1
kind: Namespace
metadata:
  name: opspilot-system
  labels:
    app.kubernetes.io/part-of: opspilot
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-shop
  labels:
    app.kubernetes.io/part-of: demo-shop
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-fault
  namespace: demo-shop
  labels:
    app.kubernetes.io/part-of: demo-shop
type: Opaque
stringData:
  token: opspilot-local-fault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: demo-shop
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: demo-shop
    app.kubernetes.io/version: "1.6.0"
    opspilot.io/managed: "true"
    opspilot.io/service: storefront
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/version: "1.6.0"
        opspilot.io/managed: "true"
        opspilot.io/service: storefront
    spec:
      containers:
        - name: storefront
          image: opspilot-demo:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: storefront
            - name: SERVICE_VERSION
              value: "1.6.0"
            - name: NAMESPACE
              value: demo-shop
            - name: CHECKOUT_URL
              value: http://checkout-api/checkout
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.opspilot-system.svc:4318
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: demo-shop
  labels:
    app.kubernetes.io/name: storefront
spec:
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: demo-shop
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: demo-shop
    app.kubernetes.io/version: "2.3.1"
    opspilot.io/managed: "true"
    opspilot.io/service: checkout-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/part-of: demo-shop
        app.kubernetes.io/version: "2.3.1"
        opspilot.io/managed: "true"
        opspilot.io/service: checkout-api
    spec:
      containers:
        - name: checkout-api
          image: opspilot-demo:0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SERVICE_NAME
              value: checkout-api
            - name: SERVICE_VERSION
              value: "2.3.1"
            - name: NAMESPACE
              value: demo-shop
            - name: PAYMENT_URL
              value: http://payment-api/pay
            - name: PAYMENT_CANARY_URL
              value: http://payment-api-canary/pay
            - name: FAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payment-fault
                  key: token
            - name: ORDERS_URL
              value: http://orders-api/orders
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.opspilot-system.svc:4318
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: demo-shop
spec:
  selector:
    app.kubernetes.io/name: checkout-api
  ports:
    - name: http
      port: 80
      targetPort: http
