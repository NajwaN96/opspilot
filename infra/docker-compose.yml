services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - opspilot-pg:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    ports:
      - "127.0.0.1:8094:8094"
    environment:
      OPSPILOT_ADDR: ":8094"
      OPSPILOT_ENV: development
      OPSPILOT_DATABASE_URL: postgres://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:-opspilot}@postgres:5432/${POSTGRES_DB:-opspilot}?sslmode=disable
      OPSPILOT_CORS_ORIGINS: "http://127.0.0.1:3461,http://localhost:3461"
      OPSPILOT_K8S_NAMESPACES: demo-shop
      OPSPILOT_K8S_CLUSTER: opspilot-dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  opspilot-pg:
